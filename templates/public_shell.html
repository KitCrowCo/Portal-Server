<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Portal Server" }}</title>
    <style id="theme-root-vars">
        {% set active_theme = theme.copy() %}
        {% if theme_diff %}{% set _ = active_theme.update(theme_diff) %}{% endif %}
        @font-face { font-family:'Inter'; src:url('/static/fonts/Inter/Inter-Regular.ttf'); }
        @font-face { font-family:'Bitter'; src:url('/static/fonts/Bitter/Bitter-Regular.ttf'); }
        :root {
            {% for key, val in active_theme.items() %}--{{ key }}: {{ val }};{% endfor %}
            --font-main: 'Inter', sans-serif;
            --font-display: 'Bitter', serif;
            --border-thick: 0.1rem;
        }
    </style>
    <style>{% include "style.css" %}</style>
</head>
<body style="max-width:50rem;margin:0 auto;padding:2rem;box-sizing:border-box;overflow:auto;">
{{ content|safe }}
</body>
</html>
